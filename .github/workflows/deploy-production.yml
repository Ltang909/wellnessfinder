# Deploys the main branch to wellfinder.ca
name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://wellfinder.ca
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync openssh-client

      - name: Deploy to Hostinger over SSH
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USERNAME }}
          SSH_PASS: ${{ secrets.NAME_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          sshpass -p "$SSH_PASS" rsync -avz --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/staging/' \
            --exclude='/.well-known/' \
            -e "ssh -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:public_html/"
